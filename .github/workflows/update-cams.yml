name: Update camera list

on:
  schedule:
    - cron: "17 5 * * 1" # every Monday, 05:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Regenerate cams.js
        run: node scripts/update-cams.mjs
      - name: Commit if the list changed
        run: |
          if git diff --quiet cams.js; then
            echo "No change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cams.js
          git commit -m "Update camera list"
          git push
